server {
    listen 80;
    server_name localhost;

    # Serve o seu frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Repassa requisições da API para o backend (Django)
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Repassa requisições do painel Admin para o backend
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve os arquivos estáticos do Django (CSS do admin)
    location /static/ {
        proxy_pass http://web:8000;
    }
}